packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts may run (pnpm 11 setting; everything else is blocked).
allowBuilds:
  esbuild: true

# openapi-typescript 7 declares typescript ^5.x but works with 6.0 (checked: it generates the types).
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"
